spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vitrine}
spring.datasource.username=${DB_USER:vitrine}
spring.datasource.password=${DB_PASSWORD:vitrine}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=${SWAGGER_ATIVO:true}
springdoc.swagger-ui.enabled=${SWAGGER_ATIVO:true}
