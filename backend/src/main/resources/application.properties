spring.application.name=vitrine-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.cors.origens-permitidas=${CORS_ORIGENS_PERMITIDAS:http://localhost:4200}

springdoc.api-docs.enabled=${SWAGGER_ATIVO:false}
springdoc.swagger-ui.enabled=${SWAGGER_ATIVO:false}
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
