<header class="cabecalho">
  <button mat-icon-button type="button" class="botao-menu" aria-label="Abrir menu de categorias" (click)="aoAbrirMenu.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <a routerLink="/" class="logo" aria-label="Vitrine, página inicial">
    <img class="logo-icone" src="marca/simbolo-vitrine.svg" alt="" width="36" height="36" />
    <span class="logo-nome">vitrine</span>
  </a>

  <form class="busca" role="search" (submit)="aoBuscar($event)">
    <input
      class="busca-campo"
      type="search"
      [formControl]="campoBusca"
      placeholder="Busque por produtos, marcas e muito mais"
      aria-label="Buscar produtos" />
    <button mat-flat-button type="submit" class="busca-botao" aria-label="Buscar">
      <mat-icon>search</mat-icon>
    </button>
  </form>

  <div class="acoes">
    <button mat-button type="button" class="cep">
      <mat-icon>location_on</mat-icon>
      <span class="texto-duplo"><small>Enviar para</small>01310-100</span>
    </button>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="tema.ehTemaEscuro() ? 'Usar tema claro' : 'Usar tema escuro'"
      (click)="tema.alternar()">
      <mat-icon>{{ tema.ehTemaEscuro() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <button mat-button type="button" class="conta">
      <mat-icon>person</mat-icon>
      <span class="texto-duplo"><small>Olá, faça seu login</small>Minha conta</span>
    </button>
    <button mat-icon-button type="button" class="favoritos" aria-label="Favoritos">
      <mat-icon>favorite</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="'Carrinho, ' + carrinho.quantidadeTotal() + ' itens'"
      [matBadge]="carrinho.quantidadeTotal()"
      [matBadgeHidden]="carrinho.quantidadeTotal() === 0"
      matBadgeSize="small"
      (click)="carrinho.ehGavetaAberta.set(true)">
      <mat-icon>shopping_cart</mat-icon>
    </button>
  </div>
</header>
