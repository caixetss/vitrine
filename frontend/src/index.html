<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vitrine</title>
    <meta name="description" content="Loja virtual de portfólio com eletrônicos, casa, moda e mais: busca com filtros, página de produto, avaliações e carrinho." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      try {
        var temaSalvo = localStorage.getItem('vitrine.tema');
        var ehEscuro = temaSalvo ? temaSalvo === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.tema = ehEscuro ? 'escuro' : 'claro';
      } catch (erro) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
