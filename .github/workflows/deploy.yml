name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRO: ca8eb89c7a37acr
  IMAGEM: ca8eb89c7a37acr.azurecr.io/vitrine
  GRUPO_DE_RECURSOS: vitrine-rg
  APP: vitrine

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test -- --watch=false
        working-directory: frontend

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az acr login --name $REGISTRO
      - run: |
          docker build -t $IMAGEM:${{ github.sha }} .
          docker push $IMAGEM:${{ github.sha }}
      - run: az containerapp update --name $APP --resource-group $GRUPO_DE_RECURSOS --image $IMAGEM:${{ github.sha }}
